name: Refresh ideas

# Weekly, after DDMarketer's Monday pipeline publishes new gaps. Public repo, so
# Actions minutes are free. Commits only when the README actually changed.
on:
  schedule:
    - cron: "0 7 * * 2" # Tuesdays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild README from DDMarketer
        run: python generate.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Weekly refresh $(date -u +%F)"
          git push
